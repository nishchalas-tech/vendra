version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vendra-postgres
    environment:
      POSTGRES_USER: vendra
      POSTGRES_PASSWORD: vendra_local_password
      POSTGRES_DB: vendra
    ports:
      - "5432:5432"
    volumes:
      - vendra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendra"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vendra-backend
    environment:
      BACKEND_PORT: 8001
      DATABASE_URL: postgresql+psycopg://vendra:vendra_local_password@postgres:5432/vendra
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      RENDER_API_KEY: ${RENDER_API_KEY:-}
      DODO_API_KEY: ${DODO_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vendra_pgdata:
