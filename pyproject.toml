[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vendra-backend"
version = "1.0.0"
description = "Vendra — AI Operating System for Physical-Product Missions (Python Backend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
